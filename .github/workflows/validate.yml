name: Validate house plans
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/convert-house-plans.cjs
      - run: node tests/validate-import.cjs
      - run: git diff --exit-code -- data/house-plans.js data/manifest.json
