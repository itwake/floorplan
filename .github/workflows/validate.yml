name: Validate house plans
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/convert-house-plans.cjs
      - run: node tests/validate-import.cjs
      - run: node tests/cabinet-design.cjs
      - run: node tests/sideboard-reference.cjs
      - run: node tests/bath-door.cjs
      - run: node tests/wood-public-area.cjs
      - run: node tests/layout-20261011.cjs
      - run: node tests/family-bath-review-20261011.cjs
      - run: node tests/family-study-laundry-20261011.cjs
      - run: node tests/family-door-refinement-20261011.cjs
      - run: node tests/family-study-door-20261012.cjs
      - run: node tests/family-appliances-20261012.cjs
      - run: node tests/family-ac-window-20261012.cjs
      - run: node tests/family-living-clear-20261012.cjs
      - run: node tests/family-balcony-service-20261012.cjs
      - run: node tests/family-corner-storage-20261012.cjs
      - run: node tests/family-ceiling-lighting-20261012.cjs
      - run: node tests/family-lighting-study-refinement-20261012.cjs
      - run: node tests/family-corner-door-180-20261012.cjs
      - run: node tests/family-balcony-recess-20261012.cjs
      - run: node tests/family-floor-drains-20261012.cjs
      - run: node tests/family-electrical-20261012.cjs
      - run: node tests/family-kitchen-heater-20261013.cjs
      - run: node tests/family-living-east-20261018.cjs
      - run: node tests/family-reference-finish-20261025.cjs
      - run: node tests/family-drawing-20261027.cjs
      - run: node tests/family-dryer-kitchen-20261031.cjs
      - run: node tests/visible-raycast.cjs
      - run: git diff --exit-code -- data/house-plans.js data/manifest.json
